apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightpage-web
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightpage-web
  template:
    metadata:
      labels:
        app: lightpage-web
    spec:
      containers:
        - name: lightpage-web
          image: ghcr.io/redbean0721/lightpage:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: lightpage-web-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: lightpage-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80