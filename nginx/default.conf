server {
    listen 80;
    listen [::]:80;
    server_name _;

    set_real_ip_from 10.42.0.0/16;
    set_real_ip_from 2001:cafe:42::/48;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
